name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          # next build imports page modules, which import the DB client. It only connects on the first
          # query, and no query runs at build time, so a placeholder is enough.
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder